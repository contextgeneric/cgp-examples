[workspace]

resolver = "3"

members = [
    "expression",
    "greet",
    "transfer",
    "builder",
    "web-app",
]

[workspace.package]
rust-version    = "1.90"
edition         = "2024"
license         = "MIT"
repository      = "https://github.com/contextgeneric/cgp-examples"
authors         = ["Soares Chen <soares.chen@maybevoid.com>"]
keywords        = ["cgp"]

[workspace.dependencies]
cgp                 = { version = "0.8.0-alpha" }
cgp-error-anyhow    = { version = "0.8.0-alpha" }

[patch.crates-io]
cgp                           = { path = "../cgp/crates/main/cgp" }
cgp-error-anyhow              = { path = "../cgp/crates/standalone/error/cgp-error-anyhow" }
# cgp                 = { git = "https://github.com/contextgeneric/cgp.git" }
# cgp-error-anyhow    = { git = "https://github.com/contextgeneric/cgp.git" }
